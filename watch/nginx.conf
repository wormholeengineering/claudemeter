# watch:80 — gateway público do ClaudeMeter (rede proxy ← cloudflared)
#
#   /usage, /health             → claude-meter:8000 (API, rede interna)
#   /firmware/manifest.json     → ./ota/manifest.json (sem cache)
#   /firmware/claudemeter-*.bin → ./ota/*.bin (imutável, nome versionado)
#   qualquer outra coisa        → 404  (admin só via docker exec na API)

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 1k;           # nada público aceita corpo

    # DNS do Docker: re-resolve claude-meter se o container for recriado
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://claude-meter:8000;

    location = /usage {
        limit_except GET { deny all; }
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /health {
        limit_except GET { deny all; }
        proxy_pass $api;
        proxy_read_timeout 10s;
    }

    location = /firmware/manifest.json {
        limit_except GET { deny all; }
        root /srv;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/firmware/claudemeter-[0-9]+\.[0-9]+\.[0-9]+\.bin$ {
        limit_except GET { deny all; }
        root /srv;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}
